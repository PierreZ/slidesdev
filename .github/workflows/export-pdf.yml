name: Export Slides to PDF

on:
  push:
    branches: [main]
    paths:
      - 'talks/**'
      - 'theme/**'

jobs:
  export-pdf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        talk: [prevention-vs-discovery, borrowing-fdb-sim, simulation-driven-development, nuit-des-communautes-2026]

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Install and export
        run: |
          nix develop --command bash -c '
            cd talks/${{ matrix.talk }} &&
            pnpm install --ignore-scripts &&
            chrome=$(echo "$PLAYWRIGHT_BROWSERS_PATH"/chromium-*/chrome-linux64/chrome) &&
            pnpm exec slidev export --executable-path "$chrome"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.talk }}-slides-pdf
          path: talks/${{ matrix.talk }}/slides-export.pdf
          retention-days: 30
